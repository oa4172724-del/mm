<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة إياد وندال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#7c3aed;--s:#3b82f6;--bg:#fdfdff;--card:#fff;--text:#0f172a;--muted:#64748b;--grad:linear-gradient(135deg,#7c3aed,#3b82f6)}
.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);transition:.3s}
header{position:sticky;top:0;z-index:50;background:var(--grad);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px}.btn{border:0;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700}.btn-w{background:#fff;color:#7c3aed}
.cats{display:flex;gap:8px;overflow:auto;padding:14px;flex-wrap:wrap}.cat{background:var(--card);border:2px solid #e2e8f0;padding:8px 16px;border-radius:999px;cursor:pointer}.cat.active{background:var(--grad);color:#fff;border-color:transparent}
.subs{display:flex;gap:8px;padding:0 14px 8px;flex-wrap:wrap}.subs button{background:#fff;border:1px dashed #a78bfa;padding:6px 12px;border-radius:999px;cursor:pointer}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:14px}.card{background:var(--card);border-radius:16px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.06)}.card img{width:100%;height:140px;object-fit:contain;background:#f8fafc;border-radius:12px}.card h3{font-size:15px;margin:6px 0}.desc{font-size:12px;color:var(--muted)}.price{color:var(--p);font-weight:800;margin-top:4px}.add{margin-top:8px;width:100%;background:var(--grad);color:#fff;border:0;padding:8px;border-radius:10px;cursor:pointer;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:100;padding:14px}.modal.show{display:grid}.box{background:var(--card);width:100%;max-width:520px;border-radius:18px;padding:16px;max-height:90vh;overflow:auto}.row{display:flex;justify-content:space-between;margin:6px 0}input,select{width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;background:var(--bg);color:var(--text)}footer{margin-top:24px;background:var(--grad);color:#fff;padding:16px;text-align:center}
</style>
</head>
<body>
<header><div class="logo">📚 مكتبة إياد وندال</div><div><button class="btn btn-w" id="themeBtn">🌙 وضع مظلم</button> <button class="btn btn-w" onclick="openCart()">🛒 <span id="count">0</span></button></div></header>
<div style="padding:36px 18px;text-align:center;background:linear-gradient(135deg,#ede9fe,#dbeafe)"><h1>كل أدواتك المدرسية - مكتبة إياد وندال</h1><p>روتو 6 ج.م - بريما عادي 7 ج.م - بريما جل 8 ج.م</p></div>
<div class="cats" id="cats"></div><div class="subs" id="subs"></div><div class="products" id="grid"></div>
<div class="modal" id="cartModal"><div class="box"><div class="row"><h3>السلة</h3><button class="btn" onclick="closeCart()">✖</button></div><div id="cartItems"></div><input id="cName" placeholder="اسمك"><input id="cPhone" placeholder="رقم تليفونك"><input id="cAddr" placeholder="عنوانك"><select id="cType"><option>هاجي اخد الطلب من المكتبة</option><option>دليفري للبيت</option></select><button class="add" onclick="sendWhats()">إرسال الطلب واتساب 01025448998</button></div></div>
<footer><p>Developed by Omar El Hadby | 01288521209</p><p>مكتبة إياد وندال - جميع الأسعار بالجنيه المصري ج.م</p></footer>
<script>
const WA="201025448998";let cart=[];
const products=[
{n:1,name:"قلم روتو أزرق",cat:"اقلام جاف",sub:"روتو",price:6,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png",desc:"روتو ازرق - 6 ج.م"},
{n:2,name:"قلم روتو أسود",cat:"اقلام جاف",sub:"روتو",price:6,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png",desc:"روتو اسود - 6 ج.م"},
{n:3,name:"قلم روتو أحمر",cat:"اقلام جاف",sub:"روتو",price:6,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png",desc:"روتو احمر - 6 ج.م"},
{n:4,name:"قلم روتو أخضر",cat:"اقلام جاف",sub:"روتو",price:6,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png",desc:"روتو اخضر - 6 ج.م"},
{n:5,name:"قلم بريما عادي",cat:"اقلام جاف",sub:"بريما",price:7,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png",desc:"بريما عادي - 7 ج.م"},
{n:6,name:"قلم بريما جل",cat:"اقلام جاف",sub:"بريما",price:8,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png",desc:"بريما جل - 8 ج.م"},
{n:8,name:"قلم رصاص عادي HB",cat:"اقلام رصاص",sub:"HB",price:5,img:"https://cdn-icons-png.flaticon.com/512/3022/3022253.png",desc:"قلم رصاص خشب HB - 5 ج.م"},
{n:9,name:"قلم سنون التكة 0.5",cat:"اقلام رصاص",sub:"سنون",price:15,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png",desc:"قلم سنون تكة - 15 ج.م"},
{n:10,name:"مسطرة 30 سم",cat:"مساطر",price:5,img:"https://cdn-icons-png.flaticon.com/512/2991/2991148.png",desc:"مسطرة - 5 ج.م"},
{n:11,name:"محاية كبيرة",cat:"محايات",price:10,img:"https://cdn-icons-png.flaticon.com/512/2553/2553642.png",desc:"محاية كبيرة - 10 ج.م"},
{n:12,name:"محاية صغيرة",cat:"محايات",price:5,img:"https://cdn-icons-png.flaticon.com/512/2553/2553642.png",desc:"محاية صغيرة - 5 ج.م"},
{n:13,name:"براية معدن",cat:"برايات",price:5,img:"https://cdn-icons-png.flaticon.com/512/2991/2991148.png",desc:"براية - 5 ج.م"},
{n:14,name:"هايلايتر",cat:"هايلايتر",price:9,img:"https://cdn-icons-png.flaticon.com/512/2921/2921222.png",desc:"الواحد 9 ج.م - الدستة 4 بـ 35 ج.م"},
{n:18,name:"علبة فوليماستر 12 لون",cat:"فوليماستر",price:35,img:"https://cdn-icons-png.flaticon.com/512/3022/3022253.png",desc:"فوليماستر - 35 ج.م"},
{n:21,name:"كشكول سلك كبير 100 ورقة",cat:"كشاكيل",sub:"كبير",price:25,img:"https://cdn-icons-png.flaticon.com/512/29/29302.png",desc:"كشكول سلك كبير - 25 ج.م"},
{n:22,name:"كشكول سلك صغير 60 ورقة",cat:"كشاكيل",sub:"صغير",price:15,img:"https://cdn-icons-png.flaticon.com/512/29/29302.png",desc:"كشكول سلك صغير - 15 ج.م"},
];
const cats=["الكل","اقلام جاف","اقلام رصاص","مساطر","محايات","برايات","هايلايتر","فوليماستر","كشاكيل"];
let active="الكل", subActive=null;
function renderCats(){
 const c=document.getElementById('cats'); c.innerHTML="";
 cats.forEach(cat=>{const d=document.createElement('div'); d.className='cat'+(active===cat?' active':''); d.innerText=cat; d.onclick=()=>{active=cat; subActive=null; renderCats(); renderProducts();}; c.appendChild(d);});
 const s=document.getElementById('subs'); s.innerHTML="";
 if(active==="اقلام جاف"){ [["روتو","روتو - 6 ج.م"],["بريما","بريما عادي 7 ج.م / جل 8 ج.م"]].forEach(([k,l])=>{const b=document.createElement('button'); b.innerText=l; b.onclick=()=>{subActive=k; renderProducts();}; s.appendChild(b);}); }
}
function renderProducts(){
 const g=document.getElementById('grid'); g.innerHTML="";
 let list=products; if(active!=="الكل") list=list.filter(p=>p.cat===active); if(subActive) list=list.filter(p=>p.sub===subActive);
 list.forEach(p=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<img src="${p.img}"><h3>${p.name}</h3><div class="desc">${p.desc}</div><div class="price">${p.price} ج.م</div><button class="add" onclick="addCart(${p.n})">إضافة للسلة 🛒</button>`;
  g.appendChild(card);
 });
}
function addCart(n){ const pr=products.find(x=>x.n===n); cart.push(pr); document.getElementById('count').innerText=cart.length; }
function openCart(){ document.getElementById('cartModal').classList.add('show'); renderCart(); }
function closeCart(){ document.getElementById('cartModal').classList.remove('show'); }
function renderCart(){
 const d=document.getElementById('cartItems'); if(cart.length===0){d.innerHTML="<p>السلة فاضية</p>";return;}
 let total=0; d.innerHTML=""; cart.forEach(p=>{ total+=p.price; const r=document.createElement('div'); r.className='row'; r.innerHTML=`<span>${p.name}</span><span>${p.price} ج.م</span>`; d.appendChild(r); });
 const t=document.createElement('div'); t.className='row'; t.style.fontWeight='800'; t.innerHTML=`<span>الإجمالي</span><span>${total} ج.م</span>`; d.appendChild(t);
}
function sendWhats(){
 const name=document.getElementById('cName').value; const phone=document.getElementById('cPhone').value; const addr=document.getElementById('cAddr').value; const type=document.getElementById('cType').value;
 if(!name||!phone||cart.length===0){alert("اكتب اسمك ورقمك");return;}
 let msg=`طلب جديد - مكتبة إياد وندال 📚%0Aالاسم: ${name}%0Aرقم العميل: ${phone}%0Aالعنوان: ${addr}%0Aالاستلام: ${type}%0A%0Aالمنتجات:%0A`; let total=0; cart.forEach(p=>{ msg+=`- ${p.name} - ${p.price} ج.م%0A`; total+=p.price; }); msg+=`%0Aالإجمالي: ${total} ج.م`;
 window.open(`https://wa.me/${WA}?text=${msg}`,'_blank');
}
document.getElementById('themeBtn').onclick=()=>{ document.body.classList.toggle('dark'); };
renderCats(); renderProducts();
</script>
</body>
</html>
